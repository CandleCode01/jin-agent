description: The Jin desktop app in your browser. `jin workbench` serves the desktop interface through the Jin dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a CandleCode product. On the first `jin workbench` run and again after each Jin update it runs `npm install --ignore-scripts` (guided by Jin's lockfile) and Vite against your Jin checkout's desktop sources, writing only under ~/.jin/jin-workbench and its own plugin dir (the checkout is only read), and starts `jin dashboard` on loopback when none is running.
